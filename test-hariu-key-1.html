html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;min-height:100%;}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line);}
h1{font-size:1rem;margin:0 0 8px;font-weight:700;letter-spacing:-0.01em;}
select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:0.9rem;}
.progress-wrap{margin-top:8px;font-size:0.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;}
main{padding:10px 14px 100px;}
.q-row{padding:7px 0;border-bottom:1px solid var(--line);}
.q-top{display:flex;align-items:center;gap:6px;}
.q-num{width:30px;flex:0 0 30px;font-size:0.82rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.choices{display:flex;gap:5px;flex:1;}
.choice{flex:1;padding:7px 0;text-align:center;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:0.8rem;font-weight:600;cursor:pointer;user-select:none;}
.choice.pick-ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.choice.pick-bad{background:var(--bad);border-color:var(--bad);color:#fff;}
.feedback{font-size:0.74rem;padding-left:36px;margin-top:3px;}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);}
.note{font-size:0.72rem;color:var(--muted);padding-left:36px;margin-top:2px;font-style:italic;}
.missing{padding-left:36px;font-size:0.8rem;color:var(--muted);font-style:italic;}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;}
footer button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:0.88rem;font-weight:600;cursor:pointer;}
footer button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:flex-end;z-index:20;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--panel);width:100%;max-height:82vh;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;}
.modal h2{font-size:0.95rem;margin:0 0 10px;}
.modal table{width:100%;border-collapse:collapse;font-size:0.78rem;}
.modal td,.modal th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;}
.modal th{color:var(--muted);font-weight:600;}
.modal tfoot td{font-weight:700;}
.modal-actions{display:flex;gap:8px;margin-top:12px;}
.modal-actions button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;cursor:pointer;}
.modal-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:0.82rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;}
.toast.show{opacity:1;}

html { -webkit-text-size-adjust: 100%; }

const STD = ['A','B','C','D','E'];
const STORAGE_KEY = 'tummenast_quiz_key_v1';

function parseLesson(raw){
  const answers = {}, notes = {}, missing = new Set();
  for (const m of raw.matchAll(/\((\d+)\s*байхгүй\)/g)) missing.add(Number(m[1]));
  for (const m of raw.matchAll(/(\d+)-[A-Z](?:,[A-Z])*\s*\(([^)]+)\)/g)) notes[Number(m[1])] = m[2];
  for (const m of raw.matchAll(/(\d+)-([A-Z](?:,[A-Z])*)/g)) answers[Number(m[1])] = m[2].split(',');
  return { answers, notes, missing };
}

const LESSONS = LESSON_DEFS.map(d => Object.assign({name:d.name, count:d.count}, parseLesson(d.raw)));

let state = {};
try{ const raw = localStorage.getItem(STORAGE_KEY); state = raw ? JSON.parse(raw) : {}; }catch(e){ state = {}; }
let current = 0;

function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

function lessonStats(li){
  const lesson = LESSONS[li];
  const picked = state[li] || {};
  let answered = 0, correct = 0;
  for(const qs in picked){
    const q = Number(qs);
    if(lesson.missing.has(q)) continue;
    answered++;
    const corr = lesson.answers[q];
    if(corr && corr.includes(picked[qs])) correct++;
  }
  return { answered, correct, total: lesson.count };
}

function renderSelect(){
  const sel = document.getElementById('lessonSelect');
  sel.innerHTML = '';
  LESSONS.forEach((l, i) => {
    const opt = document.createElement('option');
    const st = lessonStats(i);
    opt.value = i;
    opt.textContent = (i+1) + '. ' + l.name + ' (' + st.correct + '/' + st.answered + '/' + l.count + ')';
    if(i === current) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { current = Number(sel.value); renderAll(); };
}

function renderProgress(){
  const st = lessonStats(current);
  document.getElementById('lessonProgress').textContent = 'Энэ хичээл: ' + st.correct + ' зөв / ' + st.answered + ' хариулсан / ' + st.total + ' нийт';
  let tAns=0, tCor=0, tTot=0;
  LESSONS.forEach((l,i)=>{ const s=lessonStats(i); tAns+=s.answered; tCor+=s.correct; tTot+=s.total; });
  document.getElementById('totalProgress').textContent = 'Бүгд: ' + tCor + '/' + tAns + ' (' + tTot + ' нийт)';
}

function renderQuestions(){
  const lesson = LESSONS[current];
  const picked = state[current] || {};
  const main = document.getElementById('main');
  main.innerHTML = '';
  const frag = document.createDocumentFragment();
  for(let q=1; q<=lesson.count; q++){
    const row = document.createElement('div');
    row.className = 'q-row';
    if(lesson.missing.has(q)){
      row.innerHTML = '<div class="q-top"><div class="q-num">'+q+'.</div></div><div class="missing">Энэ дугаар тестэнд байхгүй</div>';
      frag.appendChild(row);
      continue;
    }
    const top = document.createElement('div');
    top.className = 'q-top';
    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = q + '.';
    top.appendChild(num);
    const choices = document.createElement('div');
    choices.className = 'choices';
    const corr = lesson.answers[q] || [];
    const sel = picked[q];
    STD.forEach(letter=>{
      const c = document.createElement('div');
      let cls = 'choice';
      if(sel === letter){ cls += corr.includes(letter) ? ' pick-ok' : ' pick-bad'; }
      c.className = cls;
      c.textContent = letter;
      c.addEventListener('click', ()=>{
        if(!state[current]) state[current] = {};
        if(state[current][q] === letter){ delete state[current][q]; }
        else { state[current][q] = letter; }
        save();
        renderAll();
      });
      choices.appendChild(c);
    });
    top.appendChild(choices);
    row.appendChild(top);
    if(sel !== undefined){
      const fb = document.createElement('div');
      const ok = corr.includes(sel);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      fb.textContent = ok ? '✓ Зөв' : ('✗ Зөв хариулт: ' + corr.join(', '));
      row.appendChild(fb);
    }
    if(lesson.notes[q]){
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = lesson.notes[q];
      row.appendChild(note);
    }
    frag.appendChild(row);
  }
  main.appendChild(frag);
}

function renderAll(){
  renderSelect();
  renderProgress();
  renderQuestions();
}

const clearBtn = document.getElementById('clearLessonBtn');
let clearArmed = false, clearTimer = null;
clearBtn.addEventListener('click', ()=>{
  if(!clearArmed){
    clearArmed = true;
    clearBtn.textContent = 'Баталгаажуулахаар дахин дарна уу';
    clearBtn.style.background = 'var(--bad)';
    clearBtn.style.color = '#fff';
    clearBtn.style.borderColor = 'var(--bad)';
    clearTimer = setTimeout(()=>{
      clearArmed = false;
      clearBtn.textContent = 'Цэвэрлэх';
      clearBtn.style.background = '';
      clearBtn.style.color = '';
      clearBtn.style.borderColor = '';
    }, 3000);
    return;
  }
  clearTimeout(clearTimer);
  clearArmed = false;
  clearBtn.textContent = 'Цэвэрлэх';
  clearBtn.style.background = '';
  clearBtn.style.color = '';
  clearBtn.style.borderColor = '';
  delete state[current];
  save();
  renderAll();
  showToast('Цэвэрллээ');
});

function buildSummary(){
  let rows = '<tr><th>Хичээл</th><th>Зөв</th><th>Хариулсан</th><th>Нийт</th></tr>';
  let tAns=0, tCor=0, tTot=0;
  LESSONS.forEach((l,i)=>{
    const s = lessonStats(i);
    tAns+=s.answered; tCor+=s.correct; tTot+=s.total;
    rows += '<tr><td>'+(i+1)+'. '+l.name+'</td><td>'+s.correct+'</td><td>'+s.answered+'</td><td>'+s.total+'</td></tr>';
  });
  rows += '<tfoot><tr><td>Бүгд</td><td>'+tCor+'</td><td>'+tAns+'</td><td>'+tTot+'</td></tr></tfoot>';
  return rows;
}

function buildSummaryText(){
  let lines = [];
  LESSONS.forEach((l,i)=>{
    const s = lessonStats(i);
    if(s.answered>0) lines.push((i+1)+'. '+l.name+': '+s.correct+'/'+s.answered+' зөв ('+l.count+' нийт)');
  });
  let tAns=0, tCor=0, tTot=0;
  LESSONS.forEach((l,i)=>{ const s=lessonStats(i); tAns+=s.answered; tCor+=s.correct; tTot+=s.total; });
  lines.push('');
  lines.push('Бүгд: '+tCor+'/'+tAns+' зөв ('+tTot+' нийт асуулт)');
  return lines.join('\n');
}

const modalBackdrop = document.getElementById('modalBackdrop');
document.getElementById('summaryBtn').addEventListener('click', ()=>{
  document.getElementById('summaryTable').innerHTML = buildSummary();
  modalBackdrop.classList.add('show');
});
document.getElementById('closeModalBtn').addEventListener('click', ()=>{ modalBackdrop.classList.remove('show'); });
document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const text = buildSummaryText();
  try{ await navigator.clipboard.writeText(text); showToast('Хууллаа'); }
  catch(e){ showToast('Хуулж чадсангүй'); }
});

function parseBulkInput(text){
  const result = {};
  const pairs = [...text.matchAll(/(\d+)\s*[-:.]\s*([A-Ea-e])/g)];
  if(pairs.length > 0){
    pairs.forEach(m => { result[Number(m[1])] = m[2].toUpperCase(); });
  } else {
    const letters = text.match(/[A-Ea-e]/g) || [];
    letters.forEach((l, idx) => { result[idx+1] = l.toUpperCase(); });
  }
  return result;
}

const bulkBackdrop = document.getElementById('bulkBackdrop');
document.getElementById('bulkBtn').addEventListener('click', ()=>{
  document.getElementById('bulkTitle').textContent = 'Бөөнөөр оруулах — ' + LESSONS[current].name;
  document.getElementById('bulkInput').value = '';
  bulkBackdrop.classList.add('show');
});
document.getElementById('bulkCloseBtn').addEventListener('click', ()=>{ bulkBackdrop.classList.remove('show'); });
document.getElementById('bulkApplyBtn').addEventListener('click', ()=>{
  const text = document.getElementById('bulkInput').value;
  const parsed = parseBulkInput(text);
  const lesson = LESSONS[current];
  if(!state[current]) state[current] = {};
  let applied = 0;
  for(const qs in parsed){
    const q = Number(qs);
    if(q >= 1 && q <= lesson.count && !lesson.missing.has(q)){
      state[current][q] = parsed[qs];
      applied++;
    }
  }
  save();
  bulkBackdrop.classList.remove('show');
  renderAll();
  showToast(applied + ' хариулт орсон');
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1500);
}

renderAll();
